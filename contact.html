  <main class="main-container">
    <div class="contact-card">
      <h2>Hubungi Saya</h2>
      <p class="section-desc">Ada pertanyaan atau ingin bekerjasama? Silakan isi formulir di bawah ini.</p>
      
      <form action="#" method="POST" class="contact-form">
        <div class="form-group">
          <label for="nama">Nama Lengkap</label>
          <input type="text" id="nama" name="nama" placeholder="Masukkan nama lengkap Anda" required>
        </div>

        <div class="form-group">
          <label for="email">Alamat Email</label>
          <input type="email" id="email" name="email" placeholder="Contoh@email.com" required>
        </div>

        <div class="form-group">
          <label for="kategori">Kategori / Keperluan</label>
          <select id="kategori" name="kategori" required>
            <option value="" disabled selected>Pilih Keperluan</option>
            <option value="konsultasi">Konsultasi</option>
            <option value="kolaborasi">Kolaborasi Proyek</option>
            <option value="umum">Pertanyaan Umum</option>
          </select>
        </div>

        <div class="form-group">
          <label for="pesan">Pesan</label>
          <textarea id="pesan" name="pesan" rows="5" placeholder="Tuliskan pesan Anda di sini..." required></textarea>
        </div>

        <button type="submit" class="btn-submit">Kirim Pesan</button>
      </form>
    </div>
  </main>
