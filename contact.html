<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil Saya - Contact</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Web Profil</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="portfolio.html">Portfolio</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>
  </header>

  <main>
    <h2>Hubungi Saya</h2>
    <form action="#" method="POST">
      <div class="form-group">
        <label for="nama">Nama Lengkap</label>
        <input type="text" id="nama" name="nama" placeholder="Masukan Nama lengkap anda
        " required>
      </div>

      <div class="form-group">
        <label for="email">Alamat Email</label>
        <input type="email" id="email" name="email" placeholder="Contoh@email.com" required>
      </div>

      <div class="form-group">
        <label for="kategori">Kategori / Keperluan</label>
        <select id="kategori" name="kategori" placeholder="Pilih Keperluan" >
          <option value="konsultasi">Konsultasi</option>
          <option value="kolaborasi">Kolaborasi Proyek</option>
          <option value="umum">Pertanyaan Umum</option>
        </select>
      </div>

      <div class="form-group">
        <label for="pesan">Pesan</label>
        <textarea id="pesan" name="pesan" rows="5" required></textarea>
      </div>

      <button type="submit">Kirim Pesan</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2026 Nama Kamu. All rights reserved.</p>
  </footer>
</body>
</html>
